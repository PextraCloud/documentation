name: Deploy documentation site
on:
  push:
    branches:
      - master

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          cd scripts
          bun install

      - name: Optimize images
        run: |
          bun run scripts/optimize-images.ts || true

      - name: Check for changes
        id: has_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit optimized images
        if: steps.has_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "chore: optimize images [skip ci]"
          git push

  deploy:
    runs-on: ubuntu-latest
    needs: optimize-images
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install mdBook and plugins
        run: |
          echo "${HOME}/.cargo/bin" >> $GITHUB_PATH
          command -v mdbook >/dev/null 2>&1 || cargo install mdbook --no-default-features --features search --locked --force
          command -v mdbook-llms-txt-tools >/dev/null 2>&1 || cargo install --git https://github.com/PextraCloud/mdbook-llms-txt-tools --force
          command -v mdbook-utils >/dev/null 2>&1 || cargo install mdbook-utils --force
          command -v mdbook-linkcheck2 >/dev/null 2>&1 || cargo install mdbook-linkcheck2 --force
          command -v mdbook-external-links2 >/dev/null 2>&1 || cargo install mdbook-external-links2 --force

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Build documentation
        run: |
          mdbook build cloudenvironment

      - name: Generate sitemap
        run: |
          mdbook-utils sitemap -m cloudenvironment/src -b https://docs.pextra.cloud -o cloudenvironment/book/html/sitemap.xml

      - name: Install Perl dependencies
        run: sudo apt install libfile-copy-recursive-perl

      - name: Run post-build script(s)
        run: |
          perl ./merge-dirs.pl cloudenvironment/book/html cloudenvironment/book/markdown cloudenvironment/book/llms-txt cloudenvironment/book/llms-txt-full cloudenvironment/static cloudenvironment/book/merged

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'cloudenvironment/book/merged'

      - name: Deploy to Pages
        id: documentation
        uses: actions/deploy-pages@v4
        
      - name: Create documentation package
        run: tar -czf pce-docs.tar.gz -C cloudenvironment/book/merged .

      - run: echo "COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pce-docs.tar.gz
          tag_name: docs-${{ env.COMMIT_SHA_SHORT }}
          name: docs-${{ env.COMMIT_SHA_SHORT }}
          body: |
            This release contains the latest documentation package. The documentation package is used by Pextra CloudEnvironment® to provide an offline version of the documentation.
          draft: false
          prerelease: false
